name: Carga Fácil — Preparação e SonarCloud

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sonar:
    name: Preparação da prova e Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Usar Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Validar infraestrutura e iniciar API da prova
        run: npm run ci
      - name: Verificar credencial do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Cadastre SONAR_TOKEN em Settings > Secrets and variables > Actions deste repositório.'
            exit 1
          fi
      - name: Analisar no SonarCloud e aguardar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Guardar relatórios da prova
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: relatorios-prova
          path: |
            output/
          if-no-files-found: warn
